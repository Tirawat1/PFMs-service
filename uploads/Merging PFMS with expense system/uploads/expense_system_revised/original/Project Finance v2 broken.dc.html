<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="./config.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#120810;--panel:#1e0f18;--panel2:#281420;--line:rgba(255,206,228,.10);--line2:rgba(255,206,228,.16);--txt:#f7eef3;--mut:#c6a2b4;--dim:#95778a;--pink:#f0378a;--pink2:#b71e60;--soft:rgba(240,55,138,.13);--green:#3fd8a4;--amber:#f5b544;--red:#ff6b9a;--blue:#7cb3ff;--purple:#b79cff}
html,body{margin:0}
body{font-family:'Manrope','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}a:hover{color:#a5cbff}
.th{font-family:'Noto Sans Thai','Manrope',sans-serif}
.dsp{font-family:'Sora','Noto Sans Thai',sans-serif;letter-spacing:-.02em}
.app{min-height:100vh;background:radial-gradient(1100px 620px at 82% -12%,rgba(240,55,138,.20),transparent 60%),radial-gradient(820px 520px at -6% 112%,rgba(150,20,70,.18),transparent 60%),var(--bg)}
.grad{background:linear-gradient(135deg,var(--pink),var(--pink2))}
.gradt{background:linear-gradient(135deg,#ff69ac,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}.dim{color:var(--dim)}
i.ph,i.ph-fill{display:inline-block;line-height:1}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.login-art{position:relative;overflow:hidden;padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(700px 500px at 20% 20%,rgba(240,55,138,.30),transparent 60%),linear-gradient(160deg,#20101a,#140a11)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px;background:rgba(10,6,9,.4)}
.login-card{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;box-shadow:0 8px 26px rgba(240,55,138,.45)}
.brand-logo i{font-size:24px;color:#fff}
.input{width:100%;background:#150b12;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;color:var(--txt);font:inherit;font-size:15px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--pink)}
.label{font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:7px;display:block;text-transform:uppercase;letter-spacing:.05em}
.btn{border:none;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s,filter .15s;font-size:14.5px}
.btn:active{transform:translateY(1px)}
.btn-primary{color:#fff}.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line2)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-sm{padding:9px 13px;font-size:13px;border-radius:10px}
.qbtn{text-align:left;background:#170c13;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s}
.qbtn:hover{border-color:var(--pink);background:#1d0f18}
.qav{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
.err{color:var(--red);font-size:13px;font-weight:600}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:rgba(12,7,10,.35);overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:22px}
.navitem{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;color:var(--mut);cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,color .15s;position:relative}
.navitem i{font-size:18px}
.navitem:hover{background:rgba(255,255,255,.045);color:var(--txt)}
.navitem.active{color:#fff;background:linear-gradient(135deg,rgba(240,55,138,.9),rgba(183,30,96,.8));box-shadow:0 8px 22px -8px rgba(240,55,138,.7)}
.navbadge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;font-size:11px;font-weight:800;padding:2px 8px;min-width:20px;text-align:center}
.navitem.active .navbadge{background:rgba(255,255,255,.25)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 30px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(18,8,16,.78);backdrop-filter:blur(14px);z-index:20}
.crumb{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13.5px;font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--mut);display:grid;place-items:center;cursor:pointer;font-size:18px;position:relative;transition:background .15s,color .15s;flex:0 0 auto}
.iconbtn:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--pink);border:2px solid var(--panel)}
.avatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.content{padding:30px;display:flex;flex-direction:column;gap:22px;max-width:1500px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.h1{font-size:32px;font-weight:800;margin:0;line-height:1.1}
.sub{color:var(--mut);font-size:14.5px;margin-top:7px;max-width:680px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:18px;padding:20px}
.panel-t{font-size:16px;font-weight:800;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stats3{grid-template-columns:repeat(3,1fr)}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.stat-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.stat-v{font-size:26px;font-weight:800;line-height:1;font-family:'Sora',sans-serif}
.stat-l{color:var(--mut);font-size:13px;font-weight:600}
.stat-s{font-size:12px;font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pipe{display:flex;gap:10px;flex-wrap:wrap}
.pipe-cell{flex:1;min-width:120px;background:#180d15;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.pipe-n{font-size:23px;font-weight:800;font-family:'Sora',sans-serif}
.pipe-l{font-size:12px;color:var(--mut);font-weight:600;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-notified{background:rgba(245,181,68,.14);color:var(--amber)}
.st-docs_submitted{background:rgba(96,165,250,.14);color:var(--blue)}
.st-verified{background:rgba(167,139,250,.16);color:var(--purple)}
.st-disbursed{background:rgba(240,55,138,.16);color:#ff77ab}
.st-purchase_complete{background:rgba(63,216,164,.14);color:var(--green)}
.st-closed{background:rgba(255,255,255,.09);color:var(--mut)}
.st-transferred{background:rgba(96,165,250,.14);color:var(--blue)}
.st-payment_made{background:rgba(245,181,68,.14);color:var(--amber)}
.st-settled{background:rgba(63,216,164,.14);color:var(--green)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700;padding:0 14px 12px}
.tbl td{padding:14px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
.trow{transition:background .12s}.trow:hover{background:rgba(255,255,255,.03)}
.tt{font-weight:700}.tsub{color:var(--dim);font-size:12.5px;margin-top:2px}
.rowlink{cursor:pointer}
.acct-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;color:#fff;flex:0 0 auto}
.chart{display:flex;align-items:flex-end;gap:14px;height:130px;padding-top:10px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--pink),rgba(240,55,138,.25));min-height:4px}
.bar-l{font-size:11.5px;color:var(--dim);font-weight:600}
.steps{display:flex;margin:6px 0 4px}
.step{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.step:after{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line2)}
.step:last-child:after{display:none}
.step-d{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#1d0f18;border:2px solid var(--line2);color:var(--dim);z-index:1}
.step.done .step-d{background:var(--green);border-color:var(--green);color:#0a1a13}
.step.cur .step-d{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 0 0 5px rgba(240,55,138,.2)}
.step.done:after{background:var(--green)}
.step-l{font-size:11.5px;font-weight:700;color:var(--mut);max-width:80px}
.step.cur .step-l{color:#fff}
.doc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#180d15}
.doc.on{border-color:rgba(63,216,164,.5);background:rgba(63,216,164,.06)}
.doc.tog{cursor:pointer}
.chk{width:23px;height:23px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex:0 0 auto;font-size:14px;color:transparent}
.doc.on .chk{background:var(--green);border-color:var(--green);color:#0a1a13}
.catcard{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .15s,transform .12s;display:flex;flex-direction:column;gap:12px}
.catcard:hover{border-color:var(--pink);transform:translateY(-2px)}
.tag{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--soft);color:#ff8bb5}
.doc-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;background:#180d15;border:1px solid var(--line);font-size:13px}
.doc-chip i{cursor:pointer;color:var(--dim);font-size:15px}
.doc-chip i:hover{color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(6,3,5,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;padding:24px}
.modal{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:26px;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.field{margin-bottom:16px}
.pill-check{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600}
.pill-check.on{border-color:var(--pink);background:var(--soft);color:#fff}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:13px;padding:13px 20px;font-weight:700;z-index:80;box-shadow:0 16px 40px rgba(0,0,0,.4);display:flex;align-items:center;gap:11px;max-width:90vw}
.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty i{font-size:40px;color:var(--line2);display:block;margin-bottom:14px}
.seg{display:inline-flex;background:#170c13;border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:none;background:none;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--pink);color:#fff}
.langtog{display:inline-flex;background:#170c13;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.langtog button{border:none;background:none;color:var(--dim);font:inherit;font-weight:800;font-size:12px;padding:7px 11px;cursor:pointer}
.langtog button.on{background:rgba(240,55,138,.2);color:#ff8bb5}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.notif{display:flex;gap:13px;padding:15px;border:1px solid var(--line);border-radius:13px;background:#180d15}
.notif.unread{border-color:rgba(240,55,138,.3);background:rgba(240,55,138,.05)}
.notif.issue-open{border-color:rgba(255,107,154,.45);background:rgba(255,107,154,.06)}
.notif.mine{box-shadow:0 0 0 1px rgba(255,107,154,.4),0 8px 28px -12px rgba(255,107,154,.55)}
.notif-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.doc-view{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;background:rgba(96,165,250,.12);padding:6px 10px;border-radius:8px;white-space:nowrap}
.doc-view i{font-size:14px}
.doc-x{color:var(--dim);cursor:pointer;font-size:16px;flex:0 0 auto}.doc-x:hover{color:var(--red)}
.doc-attach{border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--mut);font:inherit;font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.doc-attach:hover{border-color:var(--pink);color:#fff}
.drive-banner{display:flex;align-items:center;gap:11px;padding:12px 15px;border-radius:12px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);font-size:13px}
.drive-banner i{color:var(--blue);font-size:20px;flex:0 0 auto}
.drive-open{margin-left:auto;color:var(--blue);font-weight:700;text-decoration:none;font-size:12.5px;white-space:nowrap}
.filepick{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line2);border-radius:11px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--mut);width:100%}
.filepick:hover{border-color:var(--pink);color:var(--txt)}
.donut{width:158px;height:158px;border-radius:50%;flex:0 0 auto;position:relative}
.donut:after{content:"";position:absolute;inset:30px;border-radius:50%;background:#1b0f17}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.leg{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.leg-dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.leg-pct{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.act{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:none}
.act-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.act-t{font-size:13.5px;font-weight:600;line-height:1.4}
.act-m{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act-m b{color:var(--mut);font-weight:700}
.attn{display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:13px;background:var(--soft);border:1px solid rgba(240,55,138,.28);font-weight:700;font-size:14px}
.attn i{font-size:21px;color:#ff8bb5;flex:0 0 auto}
.attn-issue{background:rgba(255,107,154,.10);border-color:rgba(255,107,154,.4);cursor:pointer}
.attn-issue i{color:var(--red)}
.bankgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.bankcard{border-radius:20px;padding:22px 24px;border:1px solid rgba(240,55,138,.32);background:linear-gradient(155deg,rgba(240,55,138,.16),rgba(255,255,255,.02));display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform .12s,border-color .15s}
.bankcard:hover{transform:translateY(-2px);border-color:var(--pink)}
.bankcard.proj{border-color:rgba(168,85,247,.32);background:linear-gradient(155deg,rgba(168,85,247,.16),rgba(255,255,255,.02))}
.bankcard.dept{border-color:rgba(63,216,164,.32);background:linear-gradient(155deg,rgba(63,216,164,.13),rgba(255,255,255,.02))}
.bank-top{display:flex;align-items:center;gap:14px}
.bank-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:25px;color:#fff;flex:0 0 auto;box-shadow:0 10px 26px -8px rgba(240,55,138,.6)}
.bank-l{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.bank-bal{font-family:'Sora',sans-serif;font-weight:800;font-size:28px;line-height:1;white-space:nowrap}
.bank-cap{font-size:11.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.bank-io{display:flex;gap:10px}
.bank-io>div{flex:1;background:rgba(0,0,0,.24);border-radius:12px;padding:10px 13px}
.bank-io .k{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:.05em}
.cd{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:11.5px;font-weight:800;background:rgba(63,216,164,.13);color:var(--green);white-space:nowrap}
.cd-warn{background:rgba(245,181,68,.15);color:var(--amber)}
.cd-over{background:rgba(255,107,154,.16);color:var(--red)}
.phaseh{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.ptag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--mut);flex:0 0 auto}
.tpl-link{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--amber);text-decoration:none;background:rgba(245,181,68,.12);padding:5px 9px;border-radius:7px;white-space:nowrap}
.tpl-link:hover{color:#ffd27a}
.var-pos{color:var(--green)}.var-neg{color:var(--red)}
.issue-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.inv-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:14
</x-dc>
</body>
